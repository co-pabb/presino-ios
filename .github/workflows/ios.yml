name: Build iOS ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Presino.xcodeproj \
            -scheme Presino \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Presino.app Payload/
          zip -qry Presino-unsigned.ipa Payload
          ls -la Presino-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Presino-ipa
          path: Presino-unsigned.ipa
